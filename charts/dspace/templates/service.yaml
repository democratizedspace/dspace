apiVersion: v1
kind: Service
metadata:
  name: {{ include "dspace.fullname" . }}
  labels:
    {{- include "dspace.labels" . | nindent 4 }}
    dspace.dev/app: {{ include "dspace.name" . | quote }}
    dspace.dev/environment: {{ .Values.environment | default "production" | quote }}
    dspace.dev/release: {{ .Release.Name | quote }}
    {{- if .Values.serviceMonitor.enabled }}
    dspace.dev/cluster: {{ .Values.serviceMonitor.cluster | default "sugarkube" | quote }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "dspace.selectorLabels" . | nindent 4 }}
