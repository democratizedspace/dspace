name: Build and publish GHCR image

on:
  push:
    branches:
      - v3
      - main
  pull_request:
    branches:
      - v3
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published vX.Y.Z release to recover (leave empty for a branch image)
        required: false
        default: ''
        type: string
      branch:
        description: Branch to build and publish the image from
        required: false
        default: main
        type: choice
        options:
          - v3
          - main

permissions:
  contents: read

jobs:
  local-build:
    name: Validate Docker build with host node_modules
    runs-on: ubuntu-24.04
    # Release publication gets its own build in the semantic-release job below; skip the
    # redundant PR-style validate/smoke pass for release events.
    if: github.event_name != 'release' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure build SHA is present
        run: |
          if [ -z "$GITHUB_SHA" ]; then
            echo "GITHUB_SHA is empty; refusing to build." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Verify pnpm is on PATH
        run: |
          command -v pnpm
          pnpm --version

      - name: Compute image build version
        id: build_version
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          short_sha="$(git rev-parse --short HEAD)"
          echo "value=v${pkg_version}+${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (creates host node_modules)
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Build and verify chat build stamp
        run: |
          pnpm run build
          pnpm run verify:chat-build-stamp

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image with local node_modules present (no cache on forks)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64
          provenance: false
          build-args: |
            DSPACE_VERSION=${{ steps.build_version.outputs.value }}
            GIT_SHA=${{ github.sha }}
            VITE_GIT_SHA=${{ github.sha }}
            ENFORCE_VITE_GIT_SHA=1

      - name: Build image with local node_modules present
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=ci-image-local
          cache-to: type=gha,mode=max,ignore-error=true,scope=ci-image-local
          load: true
          tags: dspace-test:latest
          build-args: |
            DSPACE_VERSION=${{ steps.build_version.outputs.value }}
            GIT_SHA=${{ github.sha }}
            VITE_GIT_SHA=${{ github.sha }}
            ENFORCE_VITE_GIT_SHA=1

      - name: Build image for smoke test (no cache for forks)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64
          provenance: false
          load: true
          tags: dspace-test:latest
          build-args: |
            DSPACE_VERSION=${{ steps.build_version.outputs.value }}
            GIT_SHA=${{ github.sha }}
            VITE_GIT_SHA=${{ github.sha }}
            ENFORCE_VITE_GIT_SHA=1

      - name: Inspect frontend bundle location in built image
        run: |
          docker run --rm dspace-test:latest sh -lc 'ls -la /app && find /app -maxdepth 4 -type d -name dist -o -name build | head'

      - name: Assert build SHA is baked into frontend bundle
        run: |
          docker run --rm \
            -e EXPECTED_SHA="${GITHUB_SHA}" \
            -e VERIFY_BUILD_META_PATH=/app/build_meta.json \
            -v "$PWD/scripts:/scripts:ro" \
            dspace-test:latest \
            node /scripts/verify-build-sha.mjs /app/dist

      - name: Canvas native deps smoke test
        run: |
          docker run --rm --entrypoint node dspace-test:latest \
            -e "require('canvas'); console.log('canvas ok')"

      - name: Smoke test - verify container boots and serves requests
        run: |
          # Start container in background with NODE_OPTIONS to show uncaught exceptions
          docker run -d --name dspace-smoke-test -p 127.0.0.1:8080:8080 \
            -e NODE_OPTIONS="--unhandled-rejections=warn" \
            dspace-test:latest

          BASE_URL="http://127.0.0.1:8080"

          # Wait for server to start responding (up to 60 seconds)
          echo "Waiting for server to start..."
          SUCCESS=false
          for i in {1..60}; do
            CONFIG_RESPONSE=$(
              curl -s -w '\n%{http_code}' --max-time 5 "$BASE_URL/config.json" 2>/dev/null || echo -e "\n000"
            )
            CONFIG_CODE=$(echo "$CONFIG_RESPONSE" | tail -n1)
            CONFIG_BODY=$(echo "$CONFIG_RESPONSE" | head -n -1)

            HEALTH_RESPONSE=$(
              curl -s -w '\n%{http_code}' --max-time 5 "$BASE_URL/healthz" 2>/dev/null || echo -e "\n000"
            )
            HEALTH_CODE=$(echo "$HEALTH_RESPONSE" | tail -n1)
            HEALTH_BODY=$(echo "$HEALTH_RESPONSE" | head -n -1)

            if [ "$CONFIG_CODE" = "200" ] || [ "$HEALTH_CODE" = "200" ]; then
              echo "Server is responding with HTTP 200 on runtime endpoints!"
              echo "config.json: $CONFIG_CODE -> $CONFIG_BODY"
              echo "healthz: $HEALTH_CODE -> $HEALTH_BODY"
              SUCCESS=true
              break
            fi

            if [ "$i" -eq 5 ] || [ "$i" -eq 10 ] || [ "$i" -eq 30 ]; then
              echo "=== Attempt $i ==="
              echo "--- /config.json: HTTP $CONFIG_CODE ---"
              echo "$CONFIG_BODY" | head -c 500
              echo ""
              echo "--- /healthz: HTTP $HEALTH_CODE ---"
              echo "$HEALTH_BODY" | head -c 500
              echo ""
                if [[ "$CONFIG_CODE" =~ ^[0-9]+$ ]] && [ "$CONFIG_CODE" -ge 500 ] && [ -z "$CONFIG_BODY" ]; then
                  echo "Observed opaque 500 on /config.json"
                fi
                if [[ "$HEALTH_CODE" =~ ^[0-9]+$ ]] && [ "$HEALTH_CODE" -ge 500 ] && [ -z "$HEALTH_BODY" ]; then
                  echo "Observed opaque 500 on /healthz"
                fi
              echo "--- Container logs (stdout and stderr) ---"
              docker logs dspace-smoke-test 2>&1 | tail -100
              echo "--- Node.js process info ---"
              docker exec dspace-smoke-test sh -c 'ps aux' 2>&1 || true
              echo "--- Recent error logs ---"
              docker logs dspace-smoke-test 2>&1 | grep '"level":"error"' | tail -20 || true
              echo "=== End debug output ==="
            else
              echo "Attempt $i: /config.json -> $CONFIG_CODE, /healthz -> $HEALTH_CODE"
            fi
            sleep 1
          done

          if [ "$SUCCESS" = "false" ]; then
            echo "=== Server health check failed after 60 seconds ==="
            echo "--- Full container logs ---"
            docker logs dspace-smoke-test 2>&1
            echo "--- Error logs ---"
            docker logs dspace-smoke-test 2>&1 | grep '"level":"error"' || true
            echo "--- Final verbose curl response on /config.json ---"
            curl -v --max-time 5 "$BASE_URL/config.json" 2>&1 || true
            echo "--- Test healthz endpoint ---"
            curl -v --max-time 5 "$BASE_URL/healthz" 2>&1 || true
            echo "--- Test root endpoint ---"
            curl -v --max-time 5 "$BASE_URL/" 2>&1 || true
            docker stop dspace-smoke-test
            docker rm dspace-smoke-test
            exit 1
          fi

          # Also verify the root page loads
          echo "Testing root page..."
          ROOT_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8080/ 2>/dev/null || echo "000")
          if [ "$ROOT_CODE" != "200" ]; then
            echo "WARNING: Root page returned HTTP $ROOT_CODE instead of 200"
            echo "--- Root page response ---"
            curl -v --max-time 10 http://127.0.0.1:8080/ 2>&1 || true
            # Don't fail the test - config.json works, SSR has issues
            echo "NOTE: Basic API endpoints work, but SSR pages have issues. This is a pre-existing bug."
          else
            echo "Root page is responding with HTTP 200!"
          fi

          echo "Testing docs SSR page..."
          DOCS_RESPONSE=$(curl -s -w '\n%{http_code}' --max-time 10 "$BASE_URL/docs/dCarbon" 2>/dev/null || echo -e "\n000")
          DOCS_CODE=$(echo "$DOCS_RESPONSE" | tail -n1)
          DOCS_BODY=$(echo "$DOCS_RESPONSE" | head -n -1)
          if [ "$DOCS_CODE" != "200" ]; then
            echo "ERROR: /docs/dCarbon returned HTTP $DOCS_CODE"
            echo "--- /docs/dCarbon response ---"
            echo "$DOCS_BODY" | head -c 2000
            docker stop dspace-smoke-test
            docker rm dspace-smoke-test
            exit 1
          fi

          if ! echo "$DOCS_BODY" | grep -qi "dCarbon represents the amount of carbon dioxide"; then
            echo "ERROR: /docs/dCarbon did not contain expected text"
            docker stop dspace-smoke-test
            docker rm dspace-smoke-test
            exit 1
          fi
          echo "/docs/dCarbon responded with expected content"

          # Cleanup
          docker stop dspace-smoke-test
          docker rm dspace-smoke-test
          echo "Smoke test passed!"

  manual-publisher-trust:
    name: Validate exact manual publisher ref
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Require exact canonical repository and branch
        env:
          TARGET_BRANCH: ${{ github.event.inputs.branch }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          # Actions expression equality ignores case. Bash case uses exact refs.
          [[ "$GITHUB_REPOSITORY" == democratizedspace/dspace ]]
          case "$GITHUB_REF" in refs/heads/main|refs/heads/v3) ;; *) exit 1 ;; esac
          if [[ -z "$RELEASE_TAG" ]]; then
            case "$TARGET_BRANCH" in ''|main|v3) ;; *) exit 1 ;; esac
          fi

  publisher-source:
    name: Resolve native image source
    needs: manual-publisher-trust
    if: >-
      ${{ !cancelled() &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.release_tag == '' &&
        needs.manual-publisher-trust.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tags_prefix: ${{ steps.source.outputs.tags_prefix }}
      version: ${{ steps.source.outputs.version }}
      stamp: ${{ steps.source.outputs.stamp }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && format('refs/heads/{0}', github.event.inputs.branch || github.ref_name)) || github.sha }}
          persist-credentials: false
      - name: Freeze source and build coordinates
        id: source
        env:
          SOURCE_BRANCH: ${{ github.event.inputs.branch || github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_BRANCH" == main || "$SOURCE_BRANCH" == v3 ]]
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            test "$sha" = "$GITHUB_SHA"
          fi
          version="$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' package.json)"
          # Preserve the commit instant, not its recorded timezone offset.
          epoch="$(git show -s --format=%ct HEAD)"
          [[ "$epoch" =~ ^[0-9]+$ ]]
          stamp="$(node -e 'process.stdout.write(new Date(Number(process.argv[1]) * 1000).toISOString().replace(/\.000Z$/, "Z"))' "$epoch")"
          {
            echo "sha=$sha"
            echo "tags_prefix=$SOURCE_BRANCH"
            echo "version=v${version}+${sha:0:7}"
            echo "stamp=$stamp"
          } >> "$GITHUB_OUTPUT"

  publisher-native:
    name: Prepare native publisher image (${{ matrix.arch }})
    needs: publisher-source
    # A skipped manual-only ancestor on PRs/pushes must not imply failure.
    if: ${{ !cancelled() && needs.publisher-source.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      SHA: ${{ needs.publisher-source.outputs.sha }}
      PREFIX: ${{ needs.publisher-source.outputs.tags_prefix }}
      VERSION: ${{ needs.publisher-source.outputs.version }}
      STAMP: ${{ needs.publisher-source.outputs.stamp }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.publisher-source.outputs.sha }}
          persist-credentials: false
      - name: Confirm native host and frozen source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          case "$ARCH:$RUNNER_ARCH" in amd64:X64|arm64:ARM64) ;; *) exit 1 ;; esac
          test "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" = "linux/$ARCH"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.39.0
      - name: Export OCI and smoke-test image from one native build
        env:
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/native-image"
          docker buildx build --platform "linux/$ARCH" --provenance=false --sbom=false \
            --build-arg "DSPACE_VERSION=$VERSION" --build-arg "GIT_SHA=$SHA" \
            --build-arg "VITE_GIT_SHA=$SHA" --build-arg ENFORCE_VITE_GIT_SHA=1 \
            --build-arg "BUILD_TIMESTAMP=$STAMP" \
            --build-arg "DSPACE_IMAGE=ghcr.io/democratizedspace/dspace:$PREFIX-${SHA:0:7}" \
            --label "org.opencontainers.image.source=$IMAGE_SOURCE" \
            --label "org.opencontainers.image.revision=$SHA" \
            --label "org.opencontainers.image.created=$STAMP" \
            --tag dspace-verify:latest \
            --output "type=oci,dest=$RUNNER_TEMP/native-image/image.tar" \
            --output "type=docker,dest=$RUNNER_TEMP/runtime-test.tar" .
          docker load --input "$RUNNER_TEMP/runtime-test.tar"
          docker image inspect dspace-verify:latest --format '{{.Id}}' > "$RUNNER_TEMP/native-image/tested-config"
      - name: Verify bundled and served runtime identity
        run: |
          set -euo pipefail
          EXPECTED_SHA="$SHA" docker run --rm --network none -e EXPECTED_SHA \
            -e VERIFY_BUILD_META_PATH=/app/build_meta.json -v "$PWD:/verification-repo:ro" \
            dspace-verify:latest node /verification-repo/scripts/verify-build-sha.mjs /app/dist
          docker run --rm --network none -e VERIFY_REPO_ROOT=/app \
            -e VERIFY_BUILD_META_PATH=/app/build_meta.json -v "$PWD:/verification-repo:ro" \
            -w /app dspace-verify:latest node /verification-repo/scripts/verify-chat-build-stamp.mjs
          label_revision="$(docker image inspect dspace-verify:latest --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$label_revision" = "$SHA"
          container="$(docker run -d -p 127.0.0.1:18080:8080 dspace-verify:latest)"
          trap 'docker rm -f "$container"' EXIT
          info="$RUNNER_TEMP/build-info.json"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:18080/build-info.json > "$info"; then break; fi
            sleep 2
          done
          if [[ ! -s "$info" ]]; then
            docker logs "$container" >&2 || true
            exit 1
          fi
          jq -e --arg sha "$SHA" '.revision == $sha' "$info"
          curl -fsS --max-time 10 http://127.0.0.1:18080/ > "$RUNNER_TEMP/home.html"
          grep -F "name=\"dspace-build-revision\" content=\"${SHA}\"" "$RUNNER_TEMP/home.html"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publisher-native-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  publisher-index:
    name: Verify native publisher index without publishing
    needs: [publisher-source, publisher-native]
    if: >-
      ${{ !cancelled() &&
      needs.publisher-source.result == 'success' &&
      needs.publisher-native.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.publisher-source.outputs.sha }}
          persist-credentials: false
      # No cross-run ID/token: consume only this run's two named immutable artifacts.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: publisher-native-*
          path: ${{ runner.temp }}/native-inputs
      - name: Assemble and verify native index
        id: index
        env:
          SHA: ${{ needs.publisher-source.outputs.sha }}
          VERSION: ${{ needs.publisher-source.outputs.version }}
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          python3 scripts/test-prepare-native-image-index.py
          digest="$(python3 scripts/prepare-native-image-index.py "$RUNNER_TEMP/native-inputs" "$RUNNER_TEMP/native-index" "$SHA" "$IMAGE_SOURCE" "$VERSION")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  image:
    name: Publish verified native image
    needs: [publisher-source, publisher-index]
    if: >-
      ${{ !cancelled() &&
      needs.publisher-source.result == 'success' &&
      needs.publisher-index.result == 'success' &&
      github.repository == 'democratizedspace/dspace' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v3') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag == '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    concurrency:
      group: dspace-image-${{ github.event.inputs.branch || github.ref_name }}
      cancel-in-progress: false
    outputs:
      image-tag: ${{ steps.tags.outputs.sha_tag }}
    env:
      SHA: ${{ needs.publisher-source.outputs.sha }}
      PREFIX: ${{ needs.publisher-source.outputs.tags_prefix }}
      VERSION: ${{ needs.publisher-source.outputs.version }}
      EXPECTED_INDEX: ${{ needs.publisher-index.outputs.digest }}
      IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.publisher-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: publisher-native-*
          path: ${{ runner.temp }}/native-inputs
      - name: Reverify exact inputs and publication coordinates
        id: tags
        env:
          SOURCE_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$PREFIX" == main || "$PREFIX" == v3 ]]
          test "$SOURCE_BRANCH" = "$PREFIX"
          test "$(git rev-parse HEAD)" = "$SHA"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then test "$GITHUB_SHA" = "$SHA"; fi
          digest="$(python3 scripts/prepare-native-image-index.py "$RUNNER_TEMP/native-inputs" "$RUNNER_TEMP/native-index" "$SHA" "$IMAGE_SOURCE" "$VERSION")"
          test "$digest" = "$EXPECTED_INDEX"
          echo "sha_tag=ghcr.io/democratizedspace/dspace:$PREFIX-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=ghcr.io/democratizedspace/dspace:$PREFIX-latest" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install checksum-pinned Crane
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/crane-bin"
          archive="$RUNNER_TEMP/crane.tar.gz"
          curl -fsSL --max-time 90 -o "$archive" \
            https://github.com/google/go-containerregistry/releases/download/v0.20.7/go-containerregistry_Linux_x86_64.tar.gz
          printf '%s  %s\n' 8ef3564d264e6b5ca93f7b7f5652704c4dd29d33935aff6947dd5adefd05953e "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP/crane-bin" crane
          echo "$RUNNER_TEMP/crane-bin" >> "$GITHUB_PATH"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require immutable absence and publish verified index once
        env:
          GHCR_GUARD_USERNAME: ${{ github.actor }}
          GHCR_GUARD_PASSWORD: ${{ secrets.GITHUB_TOKEN }} # scan-secrets: ignore (workflow secret reference)
          IMAGE_TAG: ${{ steps.tags.outputs.sha_tag }}
        run: |
          set -euo pipefail
          node scripts/ghcr-manifest.mjs check-absent --owner democratizedspace --repo dspace --tag "${IMAGE_TAG##*:}"
          crane push --index "$RUNNER_TEMP/native-index" "$IMAGE_TAG"
      - name: Verify registry index and both native children before latest
        env:
          IMAGE_TAG: ${{ steps.tags.outputs.sha_tag }}
          LATEST_TAG: ${{ steps.tags.outputs.latest_tag }}
          GHCR_GUARD_USERNAME: ${{ github.actor }}
          GHCR_GUARD_PASSWORD: ${{ secrets.GITHUB_TOKEN }} # scan-secrets: ignore (workflow secret reference)
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { inspectImage } from './scripts/ghcr-manifest.mjs';
          const { IMAGE_TAG, SHA, EXPECTED_INDEX, RUNNER_TEMP, GHCR_GUARD_USERNAME, GHCR_GUARD_PASSWORD } = process.env;
          const local = JSON.parse(await readFile(RUNNER_TEMP + '/native-index/index.json', 'utf8'));
          const digests = Object.fromEntries(local.manifests.map(({ platform, digest }) => [platform.architecture, digest]));
          const remote = await inspectImage({
            owner: 'democratizedspace', repo: 'dspace', tag: IMAGE_TAG.split(':').at(-1),
            revision: SHA, username: GHCR_GUARD_USERNAME, password: GHCR_GUARD_PASSWORD,
          });
          assert.deepEqual(remote, { indexDigest: EXPECTED_INDEX, amd64Digest: digests.amd64, arm64Digest: digests.arm64 });
          NODE
          repo="${IMAGE_TAG%:*}"
          # An older run can finish after a newer push; never move latest back.
          ref="$(git ls-remote --exit-code origin "refs/heads/$PREFIX")"
          {
            echo '## DSPACE image tags'
            echo
            echo "Immutable tag: \`${IMAGE_TAG##*:}\`"
            echo "Verified image: \`$repo@$EXPECTED_INDEX\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${ref%%$'\t'*}" != "$SHA" ]]; then
            echo "Latest not moved: $PREFIX has advanced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          crane tag "$repo@$EXPECTED_INDEX" "${LATEST_TAG##*:}"
          test "$(crane digest "$LATEST_TAG")" = "$EXPECTED_INDEX"
          echo "Verified mutable convenience tag: \`${LATEST_TAG##*:}\`" >> "$GITHUB_STEP_SUMMARY"

  semantic-release:
    name: Publish semantic release image alias and manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      actions: write
    # Normal published releases do not depend on the manual-only trust check.
    needs: manual-publisher-trust
    if: >-
      ${{ !cancelled() &&
      ((github.event_name == 'release' && github.event.action == 'published') ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.release_tag != '' &&
        needs.manual-publisher-trust.result == 'success')) }}
    concurrency:
      group: dspace-semantic-image-${{ github.event.release.tag_name || github.event.inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - name: Resolve and authorize published release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # scan-secrets: ignore (workflow secret reference)
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Recovery requires a stable vX.Y.Z release tag" >&2
            exit 1
          }
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .draft == false and .published_at != null' \
            <<<"$release_json" >/dev/null || {
              echo "Release must already exist and be published (not draft)" >&2
              exit 1
            }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged commit without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      # Authorize event-controlled source data before setup, dependency installation, or
      # any repository-controlled lifecycle command. Tag names are passed only through env.
      - name: Authorize release source
        id: source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$source_sha" == "$tag_sha" ]] || { echo "Release tag/source mismatch" >&2; exit 1; }
          remote=https://github.com/democratizedspace/dspace.git
          existing_branches=()
          for branch in main v3; do
            set +e
            git ls-remote --exit-code --heads "$remote" "refs/heads/$branch" >/dev/null
            status=$?
            set -e
            if [[ $status -eq 0 ]]; then
              existing_branches+=("$branch")
            elif [[ $status -ne 2 ]]; then
              echo "Indeterminate discovery failure for allowed branch $branch (exit $status)" >&2
              exit "$status"
            fi
          done
          ((${#existing_branches[@]} > 0)) || { echo "No supported release branches exist" >&2; exit 1; }
          for branch in "${existing_branches[@]}"; do
            git fetch "$remote" "$branch:refs/remotes/origin/$branch" --quiet
          done
          containing_branches=()
          for branch in "${existing_branches[@]}"; do
            set +e
            git merge-base --is-ancestor "$source_sha" "refs/remotes/origin/$branch"
            status=$?
            set -e
            if [[ $status -eq 0 ]]; then
              containing_branches+=("$branch")
            elif [[ $status -ne 1 ]]; then
              echo "Indeterminate containment failure for allowed branch $branch (exit $status)" >&2
              exit "$status"
            fi
          done
          ((${#containing_branches[@]} == 1)) || { echo "Release source must be contained by exactly one supported branch" >&2; exit 1; }
          source_branch="${containing_branches[0]}"
          chart_version="$(awk '$1 == "version:" { gsub(/"/, "", $2); print $2; exit }' charts/dspace/Chart.yaml)"
          chart_tag="chart-v${chart_version}"
          git rev-parse "${chart_tag}^{commit}" >/dev/null
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_branch=$source_branch" >> "$GITHUB_OUTPUT"
          echo "chart_tag=$chart_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate all local release coordinates
        id: coordinates
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CHART_TAG: ${{ steps.source.outputs.chart_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_BRANCH: ${{ steps.source.outputs.source_branch }}
        run: node scripts/check-release-consistency.mjs --verify-local

      - name: Refuse an existing semantic tag (preflight)
        env:
          GHCR_GUARD_USERNAME: ${{ github.actor }}
          GHCR_GUARD_PASSWORD: ${{ secrets.GITHUB_TOKEN }} # scan-secrets: ignore (workflow secret reference)
          SEMANTIC_TAG: v${{ steps.coordinates.outputs.applicationVersion }}
        run: node scripts/check-release-consistency.mjs --pre-semantic

      - name: Verify immutable image provenance
        id: immutable_image
        env:
          GHCR_GUARD_USERNAME: ${{ github.actor }}
          GHCR_GUARD_PASSWORD: ${{ secrets.GITHUB_TOKEN }} # scan-secrets: ignore (workflow secret reference)
          IMAGE_TAG: ${{ steps.coordinates.outputs.imageTag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: node scripts/check-release-consistency.mjs --verify-image

      - name: Verify published chart provenance
        id: chart
        env:
          GHCR_GUARD_USERNAME: ${{ github.actor }}
          GHCR_GUARD_PASSWORD: ${{ secrets.GITHUB_TOKEN }} # scan-secrets: ignore (workflow secret reference)
          CHART_VERSION: ${{ steps.coordinates.outputs.chartVersion }}
          APPLICATION_VERSION: ${{ steps.coordinates.outputs.applicationVersion }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: node scripts/check-release-consistency.mjs --verify-chart

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # scan-secrets: ignore (workflow secret reference)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Revalidate immediately before the sole mutation. Never rebuild an application in
      # this path: create an exact registry alias of the approved immutable index.
      - name: Refuse an existing semantic tag (final)
        env:
          GHCR_GUARD_USERNAME: ${{ github.actor }}
          GHCR_GUARD_PASSWORD: ${{ secrets.GITHUB_TOKEN }} # scan-secrets: ignore (workflow secret reference)
          SEMANTIC_TAG: v${{ steps.coordinates.outputs.applicationVersion }}
        run: node scripts/check-release-consistency.mjs --pre-semantic

      - name: Publish semantic alias exactly once
        env:
          IMAGE_TAG: ${{ steps.coordinates.outputs.imageTag }}
          IMAGE_DIGEST: ${{ steps.immutable_image.outputs.indexDigest }}
          SEMANTIC_TAG: v${{ steps.coordinates.outputs.applicationVersion }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "ghcr.io/democratizedspace/dspace:${SEMANTIC_TAG}" \
            "ghcr.io/democratizedspace/dspace:${IMAGE_TAG}@${IMAGE_DIGEST}"

      - name: Verify semantic alias digest equality
        id: semantic_image
        env:
          GHCR_GUARD_USERNAME: ${{ github.actor }}
          GHCR_GUARD_PASSWORD: ${{ secrets.GITHUB_TOKEN }} # scan-secrets: ignore (workflow secret reference)
          IMAGE_TAG: v${{ steps.coordinates.outputs.applicationVersion }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          EXPECTED_IMAGE_DIGEST: ${{ steps.immutable_image.outputs.indexDigest }}
        run: node scripts/check-release-consistency.mjs --verify-image

      - name: Emit and validate release manifest
        env:
          APPLICATION_VERSION: ${{ steps.coordinates.outputs.applicationVersion }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          IMAGE_TAG: ${{ steps.coordinates.outputs.imageTag }}
          IMAGE_DIGEST: ${{ steps.immutable_image.outputs.indexDigest }}
          CHART_VERSION: ${{ steps.coordinates.outputs.chartVersion }}
          CHART_DIGEST: ${{ steps.chart.outputs.chartDigest }}
          SEMANTIC_TAG: v${{ steps.coordinates.outputs.applicationVersion }}
          RELEASE_MANIFEST_PATH: dspace-release-manifest.json
        run: |
          node scripts/check-release-consistency.mjs --emit-manifest
          node scripts/check-release-consistency.mjs --validate-manifest

      - name: Upload release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dspace-release-manifest
          path: dspace-release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Write complete release evidence
        env:
          APPLICATION_VERSION: ${{ steps.coordinates.outputs.applicationVersion }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          IMAGE_TAG: ${{ steps.coordinates.outputs.imageTag }}
          IMAGE_DIGEST: ${{ steps.immutable_image.outputs.indexDigest }}
          AMD64_DIGEST: ${{ steps.immutable_image.outputs.amd64Digest }}
          ARM64_DIGEST: ${{ steps.immutable_image.outputs.arm64Digest }}
          CHART_VERSION: ${{ steps.coordinates.outputs.chartVersion }}
          CHART_DIGEST: ${{ steps.chart.outputs.chartDigest }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Full release consistency evidence
          - Application version: $APPLICATION_VERSION
          - Full source SHA: $SOURCE_SHA
          - Immutable image: ghcr.io/democratizedspace/dspace:$IMAGE_TAG@$IMAGE_DIGEST
          - linux/amd64 manifest: $AMD64_DIGEST
          - linux/arm64 manifest: $ARM64_DIGEST
          - Semantic evidence alias: ghcr.io/democratizedspace/dspace:v$APPLICATION_VERSION@$IMAGE_DIGEST
          - Immutable chart: oci://ghcr.io/democratizedspace/charts/dspace:$CHART_VERSION@$CHART_DIGEST
          - Release manifest artifact: dspace-release-manifest/dspace-release-manifest.json
          EOF
