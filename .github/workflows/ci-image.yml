name: Build and publish GHCR image

on:
  push:
    branches:
      - v3
      - main
  pull_request:
    branches:
      - v3
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and publish the image from
        required: false
        default: main
        type: choice
        options:
          - v3
          - main

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  local-build:
    name: Validate Docker build with host node_modules
    runs-on: ubuntu-latest
    # Release publication gets its own build in the semantic-release job below; skip the
    # redundant PR-style validate/smoke pass for release events.
    if: github.event_name != 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure build SHA is present
        run: |
          if [ -z "$GITHUB_SHA" ]; then
            echo "GITHUB_SHA is empty; refusing to build." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Verify pnpm is on PATH
        run: |
          command -v pnpm
          pnpm --version

      - name: Compute image build version
        id: build_version
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          short_sha="$(git rev-parse --short HEAD)"
          echo "value=v${pkg_version}+${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (creates host node_modules)
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Build and verify chat build stamp
        run: |
          pnpm run build
          pnpm run verify:chat-build-stamp

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image with local node_modules present (no cache on forks)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64
          provenance: false
          build-args: |
            DSPACE_VERSION=${{ steps.build_version.outputs.value }}
            GIT_SHA=${{ github.sha }}
            VITE_GIT_SHA=${{ github.sha }}
            ENFORCE_VITE_GIT_SHA=1

      - name: Build image with local node_modules present
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=ci-image-local
          cache-to: type=gha,mode=max,ignore-error=true,scope=ci-image-local
          load: true
          tags: dspace-test:latest
          build-args: |
            DSPACE_VERSION=${{ steps.build_version.outputs.value }}
            GIT_SHA=${{ github.sha }}
            VITE_GIT_SHA=${{ github.sha }}
            ENFORCE_VITE_GIT_SHA=1

      - name: Build image for smoke test (no cache for forks)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64
          provenance: false
          load: true
          tags: dspace-test:latest
          build-args: |
            DSPACE_VERSION=${{ steps.build_version.outputs.value }}
            GIT_SHA=${{ github.sha }}
            VITE_GIT_SHA=${{ github.sha }}
            ENFORCE_VITE_GIT_SHA=1

      - name: Inspect frontend bundle location in built image
        run: |
          docker run --rm dspace-test:latest sh -lc 'ls -la /app && find /app -maxdepth 4 -type d -name dist -o -name build | head'

      - name: Assert build SHA is baked into frontend bundle
        run: |
          docker run --rm \
            -e EXPECTED_SHA="${GITHUB_SHA}" \
            -e VERIFY_BUILD_META_PATH=/app/build_meta.json \
            -v "$PWD/scripts:/scripts:ro" \
            dspace-test:latest \
            node /scripts/verify-build-sha.mjs /app/dist

      - name: Canvas native deps smoke test
        run: |
          docker run --rm --entrypoint node dspace-test:latest \
            -e "require('canvas'); console.log('canvas ok')"

      - name: Smoke test - verify container boots and serves requests
        run: |
          # Start container in background with NODE_OPTIONS to show uncaught exceptions
          docker run -d --name dspace-smoke-test -p 127.0.0.1:8080:8080 \
            -e NODE_OPTIONS="--unhandled-rejections=warn" \
            dspace-test:latest

          BASE_URL="http://127.0.0.1:8080"

          # Wait for server to start responding (up to 60 seconds)
          echo "Waiting for server to start..."
          SUCCESS=false
          for i in {1..60}; do
            CONFIG_RESPONSE=$(
              curl -s -w '\n%{http_code}' --max-time 5 "$BASE_URL/config.json" 2>/dev/null || echo -e "\n000"
            )
            CONFIG_CODE=$(echo "$CONFIG_RESPONSE" | tail -n1)
            CONFIG_BODY=$(echo "$CONFIG_RESPONSE" | head -n -1)

            HEALTH_RESPONSE=$(
              curl -s -w '\n%{http_code}' --max-time 5 "$BASE_URL/healthz" 2>/dev/null || echo -e "\n000"
            )
            HEALTH_CODE=$(echo "$HEALTH_RESPONSE" | tail -n1)
            HEALTH_BODY=$(echo "$HEALTH_RESPONSE" | head -n -1)

            if [ "$CONFIG_CODE" = "200" ] || [ "$HEALTH_CODE" = "200" ]; then
              echo "Server is responding with HTTP 200 on runtime endpoints!"
              echo "config.json: $CONFIG_CODE -> $CONFIG_BODY"
              echo "healthz: $HEALTH_CODE -> $HEALTH_BODY"
              SUCCESS=true
              break
            fi

            if [ "$i" -eq 5 ] || [ "$i" -eq 10 ] || [ "$i" -eq 30 ]; then
              echo "=== Attempt $i ==="
              echo "--- /config.json: HTTP $CONFIG_CODE ---"
              echo "$CONFIG_BODY" | head -c 500
              echo ""
              echo "--- /healthz: HTTP $HEALTH_CODE ---"
              echo "$HEALTH_BODY" | head -c 500
              echo ""
                if [[ "$CONFIG_CODE" =~ ^[0-9]+$ ]] && [ "$CONFIG_CODE" -ge 500 ] && [ -z "$CONFIG_BODY" ]; then
                  echo "Observed opaque 500 on /config.json"
                fi
                if [[ "$HEALTH_CODE" =~ ^[0-9]+$ ]] && [ "$HEALTH_CODE" -ge 500 ] && [ -z "$HEALTH_BODY" ]; then
                  echo "Observed opaque 500 on /healthz"
                fi
              echo "--- Container logs (stdout and stderr) ---"
              docker logs dspace-smoke-test 2>&1 | tail -100
              echo "--- Node.js process info ---"
              docker exec dspace-smoke-test sh -c 'ps aux' 2>&1 || true
              echo "--- Recent error logs ---"
              docker logs dspace-smoke-test 2>&1 | grep '"level":"error"' | tail -20 || true
              echo "=== End debug output ==="
            else
              echo "Attempt $i: /config.json -> $CONFIG_CODE, /healthz -> $HEALTH_CODE"
            fi
            sleep 1
          done

          if [ "$SUCCESS" = "false" ]; then
            echo "=== Server health check failed after 60 seconds ==="
            echo "--- Full container logs ---"
            docker logs dspace-smoke-test 2>&1
            echo "--- Error logs ---"
            docker logs dspace-smoke-test 2>&1 | grep '"level":"error"' || true
            echo "--- Final verbose curl response on /config.json ---"
            curl -v --max-time 5 "$BASE_URL/config.json" 2>&1 || true
            echo "--- Test healthz endpoint ---"
            curl -v --max-time 5 "$BASE_URL/healthz" 2>&1 || true
            echo "--- Test root endpoint ---"
            curl -v --max-time 5 "$BASE_URL/" 2>&1 || true
            docker stop dspace-smoke-test
            docker rm dspace-smoke-test
            exit 1
          fi

          # Also verify the root page loads
          echo "Testing root page..."
          ROOT_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8080/ 2>/dev/null || echo "000")
          if [ "$ROOT_CODE" != "200" ]; then
            echo "WARNING: Root page returned HTTP $ROOT_CODE instead of 200"
            echo "--- Root page response ---"
            curl -v --max-time 10 http://127.0.0.1:8080/ 2>&1 || true
            # Don't fail the test - config.json works, SSR has issues
            echo "NOTE: Basic API endpoints work, but SSR pages have issues. This is a pre-existing bug."
          else
            echo "Root page is responding with HTTP 200!"
          fi

          echo "Testing docs SSR page..."
          DOCS_RESPONSE=$(curl -s -w '\n%{http_code}' --max-time 10 "$BASE_URL/docs/dCarbon" 2>/dev/null || echo -e "\n000")
          DOCS_CODE=$(echo "$DOCS_RESPONSE" | tail -n1)
          DOCS_BODY=$(echo "$DOCS_RESPONSE" | head -n -1)
          if [ "$DOCS_CODE" != "200" ]; then
            echo "ERROR: /docs/dCarbon returned HTTP $DOCS_CODE"
            echo "--- /docs/dCarbon response ---"
            echo "$DOCS_BODY" | head -c 2000
            docker stop dspace-smoke-test
            docker rm dspace-smoke-test
            exit 1
          fi

          if ! echo "$DOCS_BODY" | grep -qi "dCarbon represents the amount of carbon dioxide"; then
            echo "ERROR: /docs/dCarbon did not contain expected text"
            docker stop dspace-smoke-test
            docker rm dspace-smoke-test
            exit 1
          fi
          echo "/docs/dCarbon responded with expected content"

          # Cleanup
          docker stop dspace-smoke-test
          docker rm dspace-smoke-test
          echo "Smoke test passed!"

  image:
    name: Build and push image
    runs-on: ubuntu-latest
    # Ordinary branch-build publish path. Must never run for release events — that is the
    # exact class of bug that let branch builds move vX.Y.Z (see DSPACE #4727 and
    # outages/2026-07-23-dspace-production-version-drift.md); semantic tags are published
    # exclusively by the semantic-release job below.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      # Serialize the absence check plus push by target branch. workflow_dispatch can
      # choose a checkout branch independently of github.sha, so branch-scoped locking
      # keeps runs for the same published tag namespace from racing.
      group: dspace-image-${{ github.event.inputs.branch || github.ref_name }}
      cancel-in-progress: false
    outputs:
      image-tag: ${{ steps.tags.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.branch) || github.ref }}
          persist-credentials: false

      - name: Ensure build SHA is present
        run: |
          if [ -z "$GITHUB_SHA" ]; then
            echo "GITHUB_SHA is empty; refusing to build." >&2
            exit 1
          fi

      # Explicitly install the Node version from .nvmrc so version reads stay stable even if
      # runner defaults change.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Verify pnpm is on PATH
        run: |
          command -v pnpm
          pnpm --version

      # Use Node to read the app version from package.json for image tagging.
      - name: Read package version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Build and verify chat build stamp
        run: |
          pnpm run build
          pnpm run verify:chat-build-stamp

      - name: Define image tags
        id: tags
        env:
          SOURCE_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
        run: |
          branch="$SOURCE_BRANCH"
          full_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          tag_prefix="${branch//\//-}"
          sha_tag="ghcr.io/democratizedspace/dspace:${tag_prefix}-${short_sha}"
          latest_tag="ghcr.io/democratizedspace/dspace:${tag_prefix}-latest"
          echo "sha_tag=${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${full_sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set image build version
        id: build_version
        run: |
          build_version="v${{ steps.version.outputs.version }}+${{ steps.tags.outputs.short_sha }}"
          echo "value=${build_version}" >> "$GITHUB_OUTPUT"

      - name: Set image metadata
        id: metadata
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          GIT_SHA: ${{ steps.tags.outputs.full_sha }}
        run: |
          created="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "created=${created}" >> "$GITHUB_OUTPUT"
          echo "source=${REPO_URL}" >> "$GITHUB_OUTPUT"
          echo "revision=${GIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for SHA verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64
          provenance: false
          load: true
          tags: dspace-verify:latest
          build-args: |
            DSPACE_VERSION=${{ steps.build_version.outputs.value }}
            GIT_SHA=${{ steps.tags.outputs.full_sha }}
            VITE_GIT_SHA=${{ steps.tags.outputs.full_sha }}
            ENFORCE_VITE_GIT_SHA=1
            BUILD_TIMESTAMP=${{ steps.metadata.outputs.created }}
            DSPACE_IMAGE=${{ steps.tags.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ steps.metadata.outputs.source }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.revision }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Assert build SHA is baked into frontend bundle
        env:
          EXPECTED_SHA: ${{ steps.tags.outputs.full_sha }}
        run: |
          docker run --rm \
            -e EXPECTED_SHA \
            -e VERIFY_BUILD_META_PATH=/app/build_meta.json \
            -v "$PWD:/verification-repo:ro" \
            dspace-verify:latest \
            node /verification-repo/scripts/verify-build-sha.mjs /app/dist

      - name: Verify chat build stamp inside image
        run: |
          docker run --rm \
            -e VERIFY_REPO_ROOT=/app \
            -e VERIFY_BUILD_META_PATH=/app/build_meta.json \
            -v "$PWD:/verification-repo:ro" \
            -w /app \
            dspace-verify:latest \
            node /verification-repo/scripts/verify-chat-build-stamp.mjs

      - name: Compare runtime identity with OCI revision
        env:
          EXPECTED_SHA: ${{ steps.tags.outputs.full_sha }}
        run: |
          label_revision="$(docker image inspect dspace-verify:latest --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$label_revision" = "$EXPECTED_SHA"
          container="$(docker run -d -p 18080:8080 dspace-verify:latest)"
          trap 'docker rm -f "$container"' EXIT
          rm -f /tmp/build-info.json
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/build-info.json > /tmp/build-info.json; then
              break
            fi
            sleep 2
          done
          if [ ! -s /tmp/build-info.json ]; then
            echo "/build-info.json did not become reachable or returned an empty response" >&2
            docker logs "$container" >&2 || true
            exit 1
          fi
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/build-info.json')).revision")" = "$label_revision"
          curl -fsS http://127.0.0.1:18080/ | grep -F "name=\"dspace-build-revision\" content=\"${label_revision}\""

      - name: Ensure immutable SHA tag is absent before push attempt 1
        id: check_sha_absent_1
        env:
          GHCR_GUARD_USERNAME: ${{ github.actor }}
          GHCR_GUARD_PASSWORD: ${{ secrets.GITHUB_TOKEN }} # scan-secrets: ignore (workflow secret reference)
          IMAGE_TAG: ${{ steps.tags.outputs.sha_tag }}
        run: |
          node scripts/ghcr-manifest.mjs check-absent \
            --owner democratizedspace \
            --repo dspace \
            --tag "${IMAGE_TAG##*:}"

      - name: Build and push image (attempt 1)
        id: build_push_1
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.latest_tag }}
          build-args: |
            DSPACE_VERSION=${{ steps.build_version.outputs.value }}
            GIT_SHA=${{ steps.tags.outputs.full_sha }}
            VITE_GIT_SHA=${{ steps.tags.outputs.full_sha }}
            ENFORCE_VITE_GIT_SHA=1
            BUILD_TIMESTAMP=${{ steps.metadata.outputs.created }}
            DSPACE_IMAGE=${{ steps.tags.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ steps.metadata.outputs.source }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.revision }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Ensure immutable SHA tag is absent before push attempt 2
        id: check_sha_absent_2
        if: steps.build_push_1.outcome == 'failure'
        env:
          GHCR_GUARD_USERNAME: ${{ github.actor }}
          GHCR_GUARD_PASSWORD: ${{ secrets.GITHUB_TOKEN }} # scan-secrets: ignore (workflow secret reference)
          IMAGE_TAG: ${{ steps.tags.outputs.sha_tag }}
        run: |
          node scripts/ghcr-manifest.mjs check-absent \
            --owner democratizedspace \
            --repo dspace \
            --tag "${IMAGE_TAG##*:}"

      - name: Build and push image (attempt 2)
        id: build_push_2
        if: steps.build_push_1.outcome == 'failure' && steps.check_sha_absent_2.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.latest_tag }}
          build-args: |
            DSPACE_VERSION=${{ steps.build_version.outputs.value }}
            GIT_SHA=${{ steps.tags.outputs.full_sha }}
            VITE_GIT_SHA=${{ steps.tags.outputs.full_sha }}
            ENFORCE_VITE_GIT_SHA=1
            BUILD_TIMESTAMP=${{ steps.metadata.outputs.created }}
            DSPACE_IMAGE=${{ steps.tags.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ steps.metadata.outputs.source }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.revision }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Summarize published image tags
        if: steps.build_push_1.outcome == 'success' || steps.build_push_2.outcome == 'success'
        run: |
          sha_tag="${{ steps.tags.outputs.sha_tag }}"
          latest_tag="${{ steps.tags.outputs.latest_tag }}"
          {
            echo "## DSPACE image tags"
            echo
            echo "Copy the tag-only values into Sugarkube \`tag=...\` commands; use the image refs for GHCR verification."
            echo
            echo "| Name | Tag-only value for Sugarkube | Published image ref |"
            echo "| --- | --- | --- |"
            echo "| Immutable image tag | \`${sha_tag##*:}\` | \`${sha_tag}\` |"
            echo "| Mutable branch convenience tag | \`${latest_tag##*:}\` | \`${latest_tag}\` |"
            echo "| Short SHA | \`${{ steps.tags.outputs.short_sha }}\` | n/a |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if both image pushes failed
        if: steps.build_push_1.outcome == 'failure' && steps.build_push_2.outcome == 'failure'
        run: exit 1

  semantic-release:
    name: Publish semantic release image alias and manifest
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    concurrency:
      group: dspace-semantic-image-${{ github.event.release.tag_name }}
      cancel-in-progress: false
    steps:
      - name: Resolve and authorize published release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # scan-secrets: ignore (workflow secret reference)
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Semantic publication requires a stable vX.Y.Z release tag" >&2
            exit 1
          }
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .draft == false and .published_at != null' \
            <<<"$release_json" >/dev/null || {
              echo "Release must already exist and be published (not draft)" >&2
              exit 1
            }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          release_branch="$(jq -r '.target_commitish | select(. == "main" or . == "v3")' <<<"$release_json")"
          echo "source_branch_hint=$release_branch" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged commit without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      # Authorize event-controlled source data before setup, dependency installation, or
      # any repository-controlled lifecycle command. Tag names are passed only through env.
      - name: Authorize release source
        id: source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_BRANCH_HINT: ${{ steps.release.outputs.source_branch_hint }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$source_sha" == "$tag_sha" ]] || { echo "Release tag/source mismatch" >&2; exit 1; }
          remote=https://github.com/democratizedspace/dspace.git
          existing_branches=()
          for branch in main v3; do
            set +e
            git ls-remote --exit-code --heads "$remote" "refs/heads/$branch" >/dev/null
            status=$?
            set -e
            if [[ $status -eq 0 ]]; then
              existing_branches+=("$branch")
            elif [[ $status -ne 2 ]]; then
              echo "Indeterminate discovery failure for allowed branch $branch (exit $status)" >&2
              exit "$status"
            fi
          done
          ((${#existing_branches[@]} > 0)) || { echo "No supported release branches exist" >&2; exit 1; }
          for branch in "${existing_branches[@]}"; do
            git fetch "$remote" "$branch:refs/remotes/origin/$branch" --quiet
          done
          containing_branches=()
          for branch in "${existing_branches[@]}"; do
            set +e
            git merge-base --is-ancestor "$source_sha" "refs/remotes/origin/$branch"
            status=$?
            set -e
            if [[ $status -eq 0 ]]; then
              containing_branches+=("$branch")
            elif [[ $status -ne 1 ]]; then
              echo "Indeterminate containment failure for allowed branch $branch (exit $status)" >&2
              exit "$status"
            fi
          done
          ((${#containing_branches[@]} > 0)) || { echo "Release source is not contained by a supported branch" >&2; exit 1; }
          # A release commit can legitimately be reachable from both branches after a merge.
          # Prefer the release's supported target_commitish, then v3 as a deterministic fallback.
          source_branch="${containing_branches[0]}"
          for branch in "${containing_branches[@]}"; do
            if [[ -n "$SOURCE_BRANCH_HINT" && "$branch" == "$SOURCE_BRANCH_HINT" ]]; then
              source_branch="$SOURCE_BRANCH_HINT"
              break
            fi
            [[ "$branch" == v3 ]] && source_branch=v3
          done
          chart_version="$(awk '$1 == "version:" { gsub(/"/, "", $2); print $2; exit }' charts/dspace/Chart.yaml)"
          chart_tag="chart-v${chart_version}"
          git rev-parse "${chart_tag}^{commit}" >/dev/null
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_branch=$source_branch" >> "$GITHUB_OUTPUT"
          echo "chart_tag=$chart_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate all local release coordinates
        id: coordinates
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CHART_TAG: ${{ steps.source.outputs.chart_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_BRANCH: ${{ steps.source.outputs.source_branch }}
        run: node scripts/check-release-consistency.mjs --verify-local

      - name: Refuse an existing semantic tag (preflight)
        env:
          GHCR_GUARD_USERNAME: ${{ github.actor }}
          GHCR_GUARD_PASSWORD: ${{ secrets.GITHUB_TOKEN }} # scan-secrets: ignore (workflow secret reference)
          SEMANTIC_TAG: v${{ steps.coordinates.outputs.applicationVersion }}
        run: node scripts/check-release-consistency.mjs --pre-semantic

      - name: Verify immutable image provenance
        id: immutable_image
        env:
          GHCR_GUARD_USERNAME: ${{ github.actor }}
          GHCR_GUARD_PASSWORD: ${{ secrets.GITHUB_TOKEN }} # scan-secrets: ignore (workflow secret reference)
          IMAGE_TAG: ${{ steps.coordinates.outputs.imageTag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: node scripts/check-release-consistency.mjs --verify-image

      - name: Verify published chart provenance
        id: chart
        env:
          GHCR_GUARD_USERNAME: ${{ github.actor }}
          GHCR_GUARD_PASSWORD: ${{ secrets.GITHUB_TOKEN }} # scan-secrets: ignore (workflow secret reference)
          CHART_VERSION: ${{ steps.coordinates.outputs.chartVersion }}
          APPLICATION_VERSION: ${{ steps.coordinates.outputs.applicationVersion }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: node scripts/check-release-consistency.mjs --verify-chart

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # scan-secrets: ignore (workflow secret reference)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Revalidate immediately before the sole mutation. Never rebuild an application in
      # this path: create an exact registry alias of the approved immutable index.
      - name: Refuse an existing semantic tag (final)
        env:
          GHCR_GUARD_USERNAME: ${{ github.actor }}
          GHCR_GUARD_PASSWORD: ${{ secrets.GITHUB_TOKEN }} # scan-secrets: ignore (workflow secret reference)
          SEMANTIC_TAG: v${{ steps.coordinates.outputs.applicationVersion }}
        run: node scripts/check-release-consistency.mjs --pre-semantic

      - name: Publish semantic alias exactly once
        env:
          IMAGE_TAG: ${{ steps.coordinates.outputs.imageTag }}
          IMAGE_DIGEST: ${{ steps.immutable_image.outputs.indexDigest }}
          SEMANTIC_TAG: v${{ steps.coordinates.outputs.applicationVersion }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "ghcr.io/democratizedspace/dspace:${SEMANTIC_TAG}" \
            "ghcr.io/democratizedspace/dspace:${IMAGE_TAG}@${IMAGE_DIGEST}"

      - name: Verify semantic alias digest equality
        id: semantic_image
        env:
          GHCR_GUARD_USERNAME: ${{ github.actor }}
          GHCR_GUARD_PASSWORD: ${{ secrets.GITHUB_TOKEN }} # scan-secrets: ignore (workflow secret reference)
          IMAGE_TAG: v${{ steps.coordinates.outputs.applicationVersion }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          EXPECTED_IMAGE_DIGEST: ${{ steps.immutable_image.outputs.indexDigest }}
        run: node scripts/check-release-consistency.mjs --verify-image

      - name: Emit and validate release manifest
        env:
          APPLICATION_VERSION: ${{ steps.coordinates.outputs.applicationVersion }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          IMAGE_TAG: ${{ steps.coordinates.outputs.imageTag }}
          IMAGE_DIGEST: ${{ steps.immutable_image.outputs.indexDigest }}
          CHART_VERSION: ${{ steps.coordinates.outputs.chartVersion }}
          CHART_DIGEST: ${{ steps.chart.outputs.chartDigest }}
          SEMANTIC_TAG: v${{ steps.coordinates.outputs.applicationVersion }}
          RELEASE_MANIFEST_PATH: dspace-release-manifest.json
        run: |
          node scripts/check-release-consistency.mjs --emit-manifest
          node scripts/check-release-consistency.mjs --validate-manifest

      - name: Upload release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dspace-release-manifest
          path: dspace-release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Write complete release evidence
        env:
          APPLICATION_VERSION: ${{ steps.coordinates.outputs.applicationVersion }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          IMAGE_TAG: ${{ steps.coordinates.outputs.imageTag }}
          IMAGE_DIGEST: ${{ steps.immutable_image.outputs.indexDigest }}
          AMD64_DIGEST: ${{ steps.immutable_image.outputs.amd64Digest }}
          ARM64_DIGEST: ${{ steps.immutable_image.outputs.arm64Digest }}
          CHART_VERSION: ${{ steps.coordinates.outputs.chartVersion }}
          CHART_DIGEST: ${{ steps.chart.outputs.chartDigest }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Full release consistency evidence
          - Application version: $APPLICATION_VERSION
          - Full source SHA: $SOURCE_SHA
          - Immutable image: ghcr.io/democratizedspace/dspace:$IMAGE_TAG@$IMAGE_DIGEST
          - linux/amd64 manifest: $AMD64_DIGEST
          - linux/arm64 manifest: $ARM64_DIGEST
          - Semantic evidence alias: ghcr.io/democratizedspace/dspace:v$APPLICATION_VERSION@$IMAGE_DIGEST
          - Immutable chart: oci://ghcr.io/democratizedspace/charts/dspace:$CHART_VERSION@$CHART_DIGEST
          - Release manifest artifact: dspace-release-manifest/dspace-release-manifest.json
          EOF
