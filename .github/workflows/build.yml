name: Build & Publish Container

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full approved v3.0.2 hotfix SHA (required for maintenance validation)
        required: true
        type: string
      publish:
        description: Publish the validated immutable image (owner approval required)
        required: true
        default: false
        type: boolean
      confirmation:
        description: To publish, type publish v3.0.2 followed by the full source SHA
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # The owner records v3.0.2 with a Git tag only after production cutover.
  # That tag must not rebuild or republish the already deployed image.
  PUSH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    name: Build multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure build SHA is present
        run: |
          if [ -z "$GITHUB_SHA" ]; then
            echo "GITHUB_SHA is empty; refusing to build." >&2
            exit 1
          fi

      - name: Compute branch + SHA tag
        id: vars
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          branch="${branch//\//-}"
          branch="$(echo "$branch" | tr '[:upper:]' '[:lower:]')"
          branch="$(echo "$branch" | sed -E 's/[^a-z0-9._-]+/-/g')"
          branch="$(echo "$branch" | sed -E 's/^[^a-z0-9_]+//')"
          if [ -z "$branch" ]; then
            branch="ref"
          fi
          short_sha="$(git rev-parse --short HEAD)"
          max_branch_len=120
          if [ "${#branch}" -gt "$max_branch_len" ]; then
            branch="${branch:0:$max_branch_len}"
          fi
          echo "branch_sha=${branch}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Safety guard – fail if trying to push from non-trusted ref
        if: ${{ env.PUSH_IMAGE == 'true' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Ref $GITHUB_REF is not allowed to publish images" >&2
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ env.PUSH_IMAGE == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=raw,value=${{ steps.vars.outputs.branch_sha }},enable=${{ steps.vars.outputs.branch_sha != '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created={{timestamp}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ env.PUSH_IMAGE == 'true' }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VITE_GIT_SHA=${{ github.sha }}
            ENFORCE_VITE_GIT_SHA=1
          cache-from: ${{ env.PUSH_IMAGE == 'true' && format('type=registry,ref={0}/{1}:buildcache', env.REGISTRY, env.IMAGE_NAME) || '' }}
          cache-to: ${{ env.PUSH_IMAGE == 'true' && format('type=registry,ref={0}/{1}:buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}

  maintenance-validate:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'democratizedspace/dspace' && github.ref == 'refs/heads/release/v3.0.x'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: read
      issues: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Validate exact maintenance source and both image architectures
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MODE: validate
        run: node scripts/maintenance-image.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-validation-receipt
          path: maintenance-receipt.json
          if-no-files-found: warn

  maintenance-publish:
    needs: maintenance-validate
    if: github.event_name == 'workflow_dispatch' && github.repository == 'democratizedspace/dspace' && github.ref == 'refs/heads/release/v3.0.x' && inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: dspace-v3.0.2-immutable-publication
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: read
      issues: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Revalidate and publish only the immutable hotfix coordinate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MODE: publish
          PUBLICATION_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/maintenance-image.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-publication-receipt
          path: maintenance-receipt.json
          if-no-files-found: warn
