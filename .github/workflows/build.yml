name: Validate Container Build

on:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure build SHA is present
        run: |
          if [ -z "$GITHUB_SHA" ]; then
            echo "GITHUB_SHA is empty; refusing to build." >&2
            exit 1
          fi

      - name: Compute branch + SHA tag
        id: vars
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          branch="${branch//\//-}"
          branch="$(echo "$branch" | tr '[:upper:]' '[:lower:]')"
          branch="$(echo "$branch" | sed -E 's/[^a-z0-9._-]+/-/g')"
          branch="$(echo "$branch" | sed -E 's/^[^a-z0-9_]+//')"
          if [ -z "$branch" ]; then
            branch="ref"
          fi
          short_sha="$(git rev-parse --short HEAD)"
          max_branch_len=120
          if [ "${#branch}" -gt "$max_branch_len" ]; then
            branch="${branch:0:$max_branch_len}"
          fi
          echo "branch_sha=${branch}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=raw,value=${{ steps.vars.outputs.branch_sha }},enable=${{ steps.vars.outputs.branch_sha != '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created={{timestamp}}

      # ci-image.yml owns publication and immutable-tag guards. This workflow validates
      # both architectures on every existing trigger, including main and v* tag pushes.
      - name: Build without publishing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VITE_GIT_SHA=${{ github.sha }}
            ENFORCE_VITE_GIT_SHA=1
