name: Validate Container Build

on:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  native-amd64:
    name: Build native image (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VALIDATION_PLATFORM: linux/amd64
    steps: &native-build-steps
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure build SHA is present
        run: |
          if [ -z "$GITHUB_SHA" ]; then
            echo "GITHUB_SHA is empty; refusing to build." >&2
            exit 1
          fi

      - name: Compute branch + SHA tag
        id: vars
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          branch="${branch//\//-}"
          branch="$(echo "$branch" | tr '[:upper:]' '[:lower:]')"
          branch="$(echo "$branch" | sed -E 's/[^a-z0-9._-]+/-/g')"
          branch="$(echo "$branch" | sed -E 's/^[^a-z0-9_]+//')"
          if [ -z "$branch" ]; then
            branch="ref"
          fi
          short_sha="$(git rev-parse --short HEAD)"
          max_branch_len=120
          if [ "${#branch}" -gt "$max_branch_len" ]; then
            branch="${branch:0:$max_branch_len}"
          fi
          echo "branch_sha=${branch}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Confirm native runner and Docker engine
        run: |
          set -euo pipefail
          case "${VALIDATION_PLATFORM}:${RUNNER_ARCH}" in
            linux/amd64:X64|linux/arm64:ARM64) ;;
            *) echo "::error::Runner architecture does not match the requested platform"; exit 1 ;;
          esac
          if [[ "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" != "$VALIDATION_PLATFORM" ]]; then
            echo "::error::Docker engine platform does not match the native runner"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=raw,value=${{ steps.vars.outputs.branch_sha }},enable=${{ steps.vars.outputs.branch_sha != '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created={{timestamp}}

      # ci-image.yml owns publication and immutable-tag guards. This workflow validates
      # both architectures on every existing trigger, including main and v* tag pushes.
      - name: Build without publishing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: ${{ env.VALIDATION_PLATFORM }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VITE_GIT_SHA=${{ github.sha }}
            ENFORCE_VITE_GIT_SHA=1

  native-arm64:
    name: Build native image (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      VALIDATION_PLATFORM: linux/arm64
    steps: *native-build-steps

  # Keep the existing check name and ID. Separate job results ensure a missing,
  # skipped, cancelled or failed architecture cannot be hidden by the other job.
  build:
    name: Build multi-arch image
    needs: [native-amd64, native-arm64]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require both native builds to succeed
        env:
          AMD64_RESULT: ${{ needs.native-amd64.result }}
          ARM64_RESULT: ${{ needs.native-arm64.result }}
        run: |
          set -euo pipefail
          printf 'Native validation: amd64=%s arm64=%s\n' "$AMD64_RESULT" "$ARM64_RESULT"
          if [[ "$AMD64_RESULT" != success || "$ARM64_RESULT" != success ]]; then
            echo "::error::Both native container builds must succeed"
            exit 1
          fi
