name: Verify published v3.0.2 November image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'democratizedspace/dspace' && github.ref == 'refs/heads/release/v3.0.x' && github.actor == 'futuroptimist' && github.triggering_actor == 'futuroptimist'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: dspace-v3.0.2-558ce3c-image-verification
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enforce owner, ref, and runner guards before emulation
        run: node scripts/verify-published-image-558ce3c.mjs --guard-only
      - uses: actions/checkout@v4
        with:
          ref: 558ce3c35163d97aea5594d6aba430c6a3dde1a3
          path: source
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64
      - name: Verify registry content and smoke both immutable platform images
        run: node scripts/verify-published-image-558ce3c.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-image-558ce3c-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: published-image-558ce3c-verification-receipt.json
          if-no-files-found: warn
