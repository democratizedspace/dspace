name: Verify immutable candidate image

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed full source SHA already on main (40 lowercase hex)
        required: true
        type: string
      image_digest:
        description: Immutable ghcr.io/democratizedspace/dspace index digest (sha256:...)
        required: true
        type: string

permissions:
  contents: read

jobs:
  offline-fixtures:
    name: Candidate verifier fixtures (${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Offline fixtures only (no registry or candidate execution)
        run: node --test scripts/verify-candidate-image.test.mjs scripts/verify-candidate-workflow.test.mjs scripts/prepare-staging-coordinates.test.mjs

  native-candidate:
    name: Verify candidate (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' && github.repository == 'democratizedspace/dspace' && github.ref == 'refs/heads/main' && github.actor == 'futuroptimist' && github.triggering_actor == 'futuroptimist'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DSPACE_SOURCE_SHA: ${{ inputs.source_sha }}
      DSPACE_IMAGE_DIGEST: ${{ inputs.image_digest }}
      DSPACE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate owner, trusted main, inputs and source ancestry
        run: node scripts/verify-candidate-image.mjs --guard-only
      - name: Verify immutable registry content and isolated native runtime
        run: node scripts/verify-candidate-image.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-image-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-image-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Candidate verification receipt
    needs: native-candidate
    if: always() && github.event_name == 'workflow_dispatch' && github.repository == 'democratizedspace/dspace' && github.ref == 'refs/heads/main' && github.actor == 'futuroptimist' && github.triggering_actor == 'futuroptimist'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DSPACE_NATIVE_JOB_RESULT: ${{ needs.native-candidate.result }}
      DSPACE_SOURCE_SHA: ${{ inputs.source_sha }}
      DSPACE_IMAGE_DIGEST: ${{ inputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-image-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-receipts
      - name: Require both exact native receipts (missing or failed is failure)
        if: always()
        run: node scripts/verify-candidate-image.mjs --aggregate candidate-receipts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-image-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-image-summary.json
          if-no-files-found: error
          retention-days: 30
